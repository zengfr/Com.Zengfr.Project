
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;

message CagPAReqMsg {
    optional CagPAInfoReq pa_info_req_msg = 1; // 名片信息请求
    optional CagBatchPAReq batch_pa_req_msg = 2; // 名片信息批量请求
}

message CagPAAckMsg {
    optional CagPAInfoAck pa_info_ack_msg = 1; // 名片信息回应
    optional CagBatchPAAck batch_pa_ack_msg = 2; // 名片信息批量回应
}

message CagGrowInfo{
    optional uint32 id = 1; // 属性ID
    optional uint32 value = 2;
    optional string str_value = 3;
    repeated uint32 ar_value = 4;
    repeated bytes byte_data = 5;
    repeated uint32 byte_len = 6;
}

//名片信息
message CagPAInfo {
    repeated CagGrowInfo grow = 1; // 积分集合
}

//名片信息请求
message CagPAInfoReq {
    required uint32 id = 1;  //玩家ID
    optional int32 type = 2;  //名片类型
}

//名片信息批量请求
message CagBatchPAReq {
    repeated uint32 ids = 1;  //玩家集合
    optional int32 type = 2;  //名片类型
}

//名片信息回应
message CagPAInfoAck {
    required uint32 id = 1;  //玩家ID
    optional int32 type = 2;  //名片类型
    optional CagPAInfo info = 3; // 查询的玩家信息[CagPAInfo]
    optional uint32 result = 4; // 查询结果
}

//名片信息批量回应
message CagBatchPAAck {
    repeated uint32 ids = 1;  //玩家集合
    optional int32 type = 2;  //名片类型
    repeated CagPAInfo info = 3; // 查询的玩家信息[CagPAInfo]
    optional uint32 result = 4; // 查询结果
}

