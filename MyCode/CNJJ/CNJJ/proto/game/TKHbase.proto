
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;

message HbaseReqMsg {
	optional HbaseCommonReq hbasecommon_req_msg = 1;
}

message HbaseAckMsg {
	optional HbaseCommonAck hbasecommon_ack_msg = 1;
}

message HbaseCommonReq {
	required string commonreqmsg = 1;
}

message HbaseCommonAck {
	optional string commonackmsg = 1;
}

