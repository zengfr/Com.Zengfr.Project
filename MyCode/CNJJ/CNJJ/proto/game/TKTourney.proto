
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;
message TourneyReqMsg    {
    required uint32 gameid = 1;
    optional GetTourneyListReq gettourneylist_req_msg = 2; // 获取 Tourney List 信息
    optional GetTourneyReq gettourney_req_mag = 3; // 获取单个 Tourney 信息
    optional GetTourneyPlayerAmountExReq gettourneyplayeramountex_req_msg = 4; // 获取比赛的人数信息
    optional GetMatchPointReq getmatchpoint_req_msg = 5; // 获取比赛的开赛点信息
    optional GetSignupDataListReq getsignupdatalist_req_msg = 6; // 获取报名条件
    optional GetSpecificTourneyInfoReq getspecifictourneyinfo_req_msg = 7; //获取指定productid的tourney信息
    optional GetSpecificTourneyInfoExReq getspecifictourneyinfoex_req_msg = 8; //获取指定productid的tourney信息,新版本,带时间戳
    optional GetCreateTableParamReq getcreatetableparam_req_msg = 9; //获取自建桌信息
    optional GetTourneyOpenCloseTimeReq gettourneyopenclosetime_req_msg = 10; //LC请求获取比赛时长（开赛时间和结束时间）
}

message TourneyAckMsg    {
    optional uint32 gameid = 1;
    optional GetTourneyListAck gettourneylist_ack_msg = 2;
    optional GetTourneyAck gettourney_ack_mag = 3;
    optional GetTourneyPlayerAmountExAck gettourneyplayeramountex_ack_msg = 4;
    optional GetMatchPointAck getmatchpoint_ack_msg = 5;
    optional GetSignupDataListAck getsignupdatalist_ack_msg = 6;
    optional GetSignupXMLDataListAck getsignupxmldatalist_ack_msg = 7;
    optional GetCreateTableParamAck getcreatetableparam_ack_msg = 8;
    optional GetTourneyOpenCloseTimeAck gettourneyopenclosetime_ack_msg = 9;
    optional GetTourneyListOpenCloseTimeAck gettourneylistopenclosetime_ack_msg = 10;
}

message TourneyData    {
    required uint32 tourneyid = 1; // Tourney Id
    required uint32 productid = 2; // Product Id
    required uint64 matchstarttime = 3; // 开赛点：有 MatchPoint 的比赛，不用这个值，没有 MatchPoint 的比赛才用这个值（比如：每天开一场的比赛，一般就是这个值）
    required uint32 tourneystat = 4; // 当前的状态
    required uint32 gameid = 5;
    required uint32 startmatchtype = 6; // 比赛类型：定点赛、及时赛、岛屿赛...
    optional uint32 boutno = 7;
    optional uint32 reserve = 8;
    optional uint32 misip = 9;
    optional uint32 misport = 10;
    optional uint32 risip = 11;
    optional uint32 risport = 12;
}

message GetTourneyListReq    {
  optional uint32 nullvalue = 1;
}

message GetTourneyListAck    {
    repeated TourneyData tourneylist = 1;
}


message GetTourneyReq    {
    required uint32 tourneyid = 1;
}

message GetTourneyAck    {
    //required uint32 tourneyid = 1;
    required TourneyData tourneydata = 2;
}

message TourneyPlayerAmountEx    {
    // 对于每个比赛的人数，我们现在的逻辑时：显示人最多的一个
    required uint32 tourneyid = 1;
    required uint32 signupamount = 2; // 报名人数
    required uint32 playingamount = 3; // 参赛人数
    required uint32 runamount = 4; // 激战人数
}

message GetTourneyPlayerAmountExReq    {
  optional uint32 nullvalue = 1;
}

message GetTourneyPlayerAmountExAck    {
    repeated TourneyPlayerAmountEx amountlist = 1;
}

message MatchPoint    {
    required uint32 matchpoint = 1; // 开赛点
    required uint32 matchid = 2; // Match Id
    required uint32 signupamount = 3; // 报名人数
    required uint32 playingamount = 4; // 参赛人数
    required uint32 runamount = 5; // 激战人数
    required uint32 state = 6; // 当前状态：可报名、准备中...
    optional uint32 param = 7;
}

message TourneyMatchPoint    {
    required uint32 tourneyid = 1;
    repeated MatchPoint matchpointlist = 2;
}

message GetMatchPointReq    {
    repeated uint32 tourneyid = 1[packed=true];
}

message GetMatchPointAck    {
    repeated TourneyMatchPoint tourneymatchpointlist = 2;
}

message GrowCondItem    {
    required uint32 growid = 1; // 成就 Id
    required uint32 maxvalue = 2; // 最大值
    required uint32 minvalue = 3; // 最小值
}

message WareCondItem    {
    required uint32 waretypeid = 1; // 物品 Id
    required uint32 maxvalue = 2; // 最大值
    required uint32 minvalue = 3; // 最小值
}

message MatchSignupGrowItem    {
    required uint32 growid = 1; // 成就 Id
    required uint32 growcount = 2; // 数量
}

message MatchSignupWareItem    {
    required uint32 waretypeid = 1; // 物品 Id
    required uint32 warecount = 2; // 数量
}

message MatchSignupItem    {
    required uint32 signuptype = 1; // 报名条件的 Id
    required string signupnote = 2; // 说明语：显示给用户看的，比如：100金币 PK 参赛券
    required uint32 coin = 3; // 需要的元宝
    required uint32 bonus = 4; // 需要的奖券
    required uint32 gold = 5; // 需要的金币
    required uint32 cert = 6; // 需要的元宝
    repeated MatchSignupGrowItem growlist = 7; // 需要的成就
    repeated MatchSignupWareItem warelist = 8; // 需要的物品
}

message GetSignupDataListReq    {
    repeated uint32 tourneyid = 1[packed=true];
    optional uint32 timestamp = 2; //时间戳
}

message TourneySignupDataList    {
    optional uint32 param = 1;
    required uint32 tourneyid = 2;
    optional string signupnotecondition = 3;
    repeated GrowCondItem growlist = 4; // 该比赛的限制条件：比如经验值大于 20000
    repeated WareCondItem warelist = 5; // 该比赛的限制条件：比如拥有大师证
    repeated MatchSignupItem matchsignuplist = 6; // 报名条件的列表（如果没有报名条件，就是免费）
}

message GetSignupDataListAck    {
    repeated TourneySignupDataList tourneysignupdatalist = 2;
}

message GetSpecificTourneyInfoReq {
    repeated uint32 productid = 1;
}

message RequestTourneyData {
    required uint32 productid = 1;
    optional uint32 timestamp = 2; //时间戳,如果不赋值,则发送老版本的signupdata,否则发送新的xml的signupdata
}

message GetSpecificTourneyInfoExReq {
    repeated RequestTourneyData requestdata = 1;
}

message TourneySignupXMLDataList {
    required uint32 tourneyid = 1;
    required uint32 timestamp = 2; //时间戳
    required string xml = 3;//xml内容
}

message GetSignupXMLDataListAck {
    repeated TourneySignupXMLDataList tourneysignupxmldatas = 1;
}

message GetCreateTableParamReq {
    optional uint32 tourneyid = 1;
}

message GetCreateTableParamAck {
    optional uint32 tourneyid = 1;
    optional string xml = 2;
}

message GetTourneyOpenCloseTimeReq {
    optional uint32 tourneyid = 1;
}

message GetTourneyOpenCloseTimeAck {
    optional uint32 tourneyid = 1;
    optional uint64 starttime = 2;
    optional uint64 endtime = 3;
}

message TourneyOpenCloseTimeList {
    optional uint32 tourneyid = 1;
    optional uint64 starttime = 2;
    optional uint64 endtime = 3;
}

message GetTourneyListOpenCloseTimeAck    {
    repeated TourneyOpenCloseTimeList tourneyopenclosetimelists = 1;
}

