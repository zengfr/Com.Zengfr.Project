
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;
message MatchReqMsg  {
	required uint32 matchid = 1;
//	optional uint32 gameid = 2;
	optional EnterMatchReq entermatch_req_msg = 3; // 确认进入比赛
	optional EnterRoundReq enterround_req_msg = 4; // 确认进入局制
	optional ExitGameReq exitgame_req_msg = 5; // 请求退出比赛
	optional PushUserPlaceOrderPositionReq pushuserplaceorderposition_req_msg = 6; // 请求获得当前玩家排名：这个只会告诉 当前名次 和 玩家总数
	optional GetStagePlayerOrderReq getstageplayerorder_req_msg = 7; // 请求获得 Stage 里面的排名信息：这个会获得一个 xml，里面有很多人的信息（昵称、名次、积分、是否出局），已按名次排序
	optional ContinueReq continue_req_msg = 8; // 请求岛屿赛继续
	optional LeaveReq leave_req_msg = 9; // 请求离开岛屿赛
	optional HematinicReq hematinic_req_msg = 10; // 请求加血（岛屿赛）
	optional PlayerReliveReq playerrelive_req_msg = 11; // 请求复活
	optional RegisterAutoReq registerauto_req_msg = 12; // 请求注册
	optional PlayerSitDownReq playersitdown_req_msg = 13; // 请求坐下（散桌赛，斗地主没有，德州有）
	optional AddHPReq addhp_req_msg = 14; // 请求补充筹码（散桌赛）
	optional MarkPlayerIdleReq markplayeridle_req_msg = 15; // 请求下一局旁观（散桌赛）
	optional MarkAutoAddHPReq markautoaddhp_req_msg = 16; // 请求自动补充筹码（散桌赛）
	optional StartableAcceptInviteReq startableacceptinvite_req_msg = 17; // 目前无用
	optional ExitMatchReq exitmatch_req_msg = 20; // 请求进入并退出比赛：用于在斗地主的客户端里面，收到了德州扑克的开赛消息时
	optional StageBoutResultReq stageboutresult_req_msg = 21; // 请求获取当前剩余桌数（锦标赛）
	optional GameSimpleActionReq gamesimpleaction_req_msg = 22; // 请求发送表情或文字ID
	optional GetRoundPlayerOrderReq getroundplayerorder_req_msg = 23; // 获取玩家在round中的排名
	optional LockDownReq lockdown_req_msg = 24; //岛屿赛锁定对手请求
	optional PlayerChangeTableReq playerchangetable_req_msg = 25; //游戏桌切换
	optional GameAutoAddhpTouchedReq gameautoaddhptouched_req_msg = 26; //上传用户是否点过"自动补充筹码"
	optional PlayerReceivedMatchAwardReq playerreceivedmatchaward_req_msg = 27; //玩家确认收到奖状消息
	optional UserReqreliveReq userreqrelive_req_msg = 28;  // 用户请求复活
	optional UserReqAddonReq userreqaddon_req_msg = 29; //用户请求add on
	optional UserReqHematinicReq userreqhematinic_req_msg = 30; // 用户请求补血
	optional GamePlayerScanReq gameplayerscan_req_msg = 31; // 用户上传位置信息搜索附近玩家
	optional GameEnterTableReq gameentertable_req_msg = 32; // 用户请求进入指定桌
	optional GameLeaveTableReq gameleavetable_req_msg = 33; // 用户请求离开桌子
	optional GameLBSGetBillReq gamelbsgetbill_req_msg = 34; // lbs用户请求帐单
	optional SaveHPReq savehp_req_msg = 35; // 自由桌 请求保存筹码（回兑部分筹码）
	optional GameFdTableBillReq gamefdtablebill_req_msg = 36; // 自建桌结算账单
	optional GameFdTableFinalBillReq gamefdtablefinalbill_req_msg = 37; // 自建桌结算最终账单
	optional GameRoomHostKickReq gameroomhostkick_req_msg = 38; // 自建桌踢人
	optional GameFdTablePermitSetReq gamefdtablepermitset_req_msg = 39; // 自建桌审批
	optional GamePlayerReadyReq gameplayerready_req_msg = 40; // 约战桌用户准备开始游戏
	optional GameOpenStageBoutResultReq gameopenstageboutresult_req_msg = 41;
	optional GameFdTablePreEndReq gamefdtablepreend_req_msg = 42;//牌桌提前解散
	optional GameMatchArchiveReq  gamematcharchive_req_msg = 43;  //用户请求比赛进度存档
	optional GameGetSeatRankInfoReq  gamegetseatrankinfo_req_msg = 44; //用户请求排名信息
	optional FDRoomTransferReq  fdroomtransfer_req_msg = 45;  //自建桌房间转换
	optional FdtableManualbeginReq  fdtablemanualbegin_req_msg = 46;  //自建桌手动开赛
	optional GamePaymentCostReq  gamepaymentcost_req_msg = 47;  //客户端对服务器下发消息的回馈 ack
	optional HDLInfoReq hdlinfo_req_msg = 48; // GC通知用户操作信息
	optional OpenRedpacketReq openredpacket_req_msg = 49; // GC通知MS拆红包
	optional GetCardRightReq getcardright_req_msg = 50; // 用户请求交换牌权
	optional ConfirmAardinfoReq confirmaardinfo_req_msg = 51; //拆红包请求-批量
	optional CommonProtocolReq commonprotocol_req_msg = 52; //通用协议
	optional LuckCardUserOptReq luckcarduseropt_req_msg = 53; //用户LuckCard选项
	optional AddLuckReq addluck_req_msg = 54; //请求金币兑换幸运点
	optional GameCommonProtocolReq gamecommonprotocol_req_msg = 55; //游戏通用协议
}

message MatchAckMsg  {
	required uint32 matchid = 1;
//	optional uint32 gameid = 2;
	optional EnterMatchAck entermatch_ack_msg = 3;
	optional EnterRoundAck enterround_ack_msg = 4;
	optional ExitGameAck exitgame_ack_msg = 5;
	optional PushUserPlaceOrderPositionAck pushuserplaceorderposition_ack_msg = 6;
	optional ContinueAck continue_ack_msg = 8;
	optional LeaveAck leave_ack_msg = 9;
	optional HematinicAck hematinic_ack_msg = 10;
	optional PlayerReliveAck playerrelive_ack_msg = 11;
	optional RegisterAutoAck registerauto_ack_msg = 12;
	optional PlayerSitDownAck playersitdown_ack_msg = 13;
	optional AddHPAck addhp_ack_msg = 14;
	optional MarkPlayerIdleAck markplayeridle_ack_msg = 15;
	optional MarkAutoAddHPAck markautoaddhp_ack_msg = 16;
	optional StartableAcceptInviteAck startableacceptinvite_ack_msg = 17;
	optional TipMsgAck tipmsg_ack_msg = 18; // 服务器下发的提示信息
	optional PushMatchStagePositionAck pushmatchstageposition_ack_msg = 19;
	optional StagePlayerOrderAck stageplayerorder_ack_msg = 20;
	optional RoundPlayerOrderAck roundplayerorder_ack_msg = 21;
	optional PushMatchPlayerInfoAck pushmatchplayerinfo_ack_msg = 22; // 下发此桌的参赛人物信息（3人 PK 的战绩等，目前用于判断是否处于晋级等待了）
	optional AddGamePlayerInfoAck addgameplayerinfo_ack_msg = 23; // 下发此桌的玩家信息
	optional PushRoundRulerInfoAck pushroundrulerinfo_ack_msg = 24; // 局制信息：赛制等的 xml
	optional BeginHandAck beginhand_ack_msg = 25; // 一把开始了
	optional RulerInfoAck rulerinfo_ack_msg = 26; // 游戏时间、JJ 炸弹规则等
	optional StagePlayerOrderChangedAck stageplayerorderchanged_ack_msg = 27;
	optional NoQueryExitGameAck noqueryexitgame_ack_msg = 28; // 比赛已经结束
	optional PushMatchAwardAck pushmatchaward_ack_msg = 29; // 奖状信息
	optional ScoreBaseRaiseAck scorebaseraise_ack_msg = 30; // 游戏基数增加
	optional ChangeGameRulerNoteAck changegamerulernote_ack_msg = 31;
	optional RestAck rest_ack_msg = 32; // 岛屿赛休息
	optional ReliveCostAck relivecost_ack_msg = 34; // 服务器下发复活条件
	optional PushGameCountAwardInfoAck pushgamecountawardinfo_ack_msg = 35;
	optional PushPlayerGameDataAck pushplayergamedata_ack_msg = 36;
	optional NotifyGuestRegisterAck notifyguestregister_ack_msg = 37; // 提示玩家注册
	optional NetBreakAck netbreak_ack_msg = 38;
	optional NetResumeAck netresume_ack_msg = 39;
	optional HistoryMsgBeginAck historymsgbegin_ack_msg = 40; // 历史消息开始：历史消息这一段会把这一局之前的消息都重新发送一次
	optional HistoryMsgEndAck historymsgend_ack_msg = 41; // 历史消息结束
	optional HandOverAck handover_ack_msg = 42; // 一把结束
	optional OverGameAck overgame_ack_msg = 43; // 一局结束
	optional InitGameTableAck initgametable_ack_msg = 44; // 初始化桌子上的玩家信息（散桌赛）
	optional VIPModeAck vipmode_ack_msg = 45;
	optional StageBoutResultAck stageboutresult_ack_msg = 46;
	optional GameSimpleActionAck gamesimpleaction_ack_msg = 47;
	optional GameCVAwardInfoAck gamecvawardinfo_ack_msg = 48;
	optional GameCVAwardAck gamecvaward_ack_msg = 49;
	optional LockDownAck lockdown_ack_msg = 50; //岛屿赛锁定对手
	optional MarkLockDownAck marklockdown_ack_msg = 51; //通知客户端锁定了本局选手
	optional RulerInfoExAck rulerinfoex_ack_msg = 52; // 游戏时间、JJ 炸弹规则等
	optional GameJackPotAck gamejackpot_ack_msg = 53; // 通知客户端当前奖池描述
	optional GameJackPotCountAck gamejackpotcount_ack_msg = 54; // 通知客户端当前奖池大小
	optional GameJackPotWinnerAck gamejackpotwinner_ack_msg = 55; // 通知客户端当前中奖玩家列表
	optional GamePlayerArrivedAck gameplayerarrived_ack_msg = 56; // Player到达（用户进入游戏）
	optional ExchangeislandAck exchangeisland_ack_msg = 57;			//岛屿赛的加血设置
	optional MatchOptionAck matchoption_ack_msg = 58; //换桌
	optional PushMatchActionAck pushmatchaction_ack_msg = 59;
	optional GameOpenStageBoutResultAck gameopenstageboutresult_ack_msg = 60;
	optional UserReliveSelectexAck userreliveselectex_ack_msg = 61; //通知让玩家复活
	optional UserAddonSelectAck useraddonselect_ack_msg = 62; //通知让玩家add on
	optional UserAddonSelectExAck useraddonselectex_ack_msg = 63; //通知让玩家add on ex
	optional GameEnterTableAck gameentertable_ack_msg = 64; // 用户请求进入指定桌
	optional GameLeaveTableAck gameleavetable_ack_msg = 65; // 用户请求离开桌子
	optional GameLBSGetBillAck gamelbsgetbill_ack_msg = 66; // lbs用户请求帐单
	optional GameFdTableBillAck gamefdtablebill_ack_msg = 67; // 自建桌结算账单
	optional GameFdTableFinalBillAck gamefdtablefinalbill_ack_msg = 68; // 自建桌结算最终账单
	optional GameFdTableScoreAck gamefdtablescore_ack_msg = 69; // 自建桌得分数据
	optional GameRoomHostKickAck gameroomhostkick_ack_msg = 70; // 自建桌踢人
	optional GameFdTablePermitSetAck gamefdtablepermitset_ack_msg = 71; // 自建桌审批
	optional GameFdTableInfoAck gamefdtableinfo_ack_msg = 72; // 推送自建桌信息
	optional GamePlayerReadyAck gameplayerready_ack_msg = 73; // 约战桌用户准备开始游戏
	optional GameFdTablePreEndAck gamefdtablepreend_ack_msg = 74; //牌桌提前解散
	optional GameMatchArchiveAck gamematcharchive_ack_msg = 75; //用户请求比赛存档
	optional GameGetSeatRankInfoAck gamegetseatrankinfo_ack_msg = 76; //用户请求排名信息
	optional FDRoomTransferAck  fdroomtransfer_ack_msg = 77;  //自建桌房间转换
	optional FDRoomHostInheritAck  fdroomhostinherit_ack_msg = 78;  //自建桌房主移交
	optional PushSuperBankerListAck  pushsuperbankerlist_ack_msg = 79;
	optional PushFdtableScoreexAck  pushfdtablescoreex_ack_msg = 80; //自建桌局间数据扩展
	optional FdtableManualbeginAck  fdtablemanualbegin_ack_msg = 81; //自建桌手动开赛
	optional GamePaymentCostAck  gamepaymentcost_ack_msg = 82;  //通知客户端，让玩家选择支付业务扣费
	optional GamePaymentResultAck  gamepaymentresult_ack_msg = 83;  //通知客户端，玩家选择支付业务扣费 的结果
	optional ProcessAwardPushAck  processawardpush_ack_msg = 84;  //MS通知客户端过程奖励内容 推送消息
	optional OpenRedpacketAck openredpacket_ack_msg = 85; // GC通知MS拆红包 响应
	optional GetCardRightAck getcardright_ack_msg = 86; // 用户请求交换牌权 响应
	optional ConfirmAardinfoAck confirmaardinfo_ack_msg = 87; //拆红包请求-批量 响应
	optional CommonProtocolAck commonprotocol_ack_msg = 88; //通用协议
	optional LuckCardInfoAck luckcardinfo_ack_msg = 89; //通知让玩家LuckCard配置信息
	optional ConsumeLuckyAck consumelucky_ack_msg = 90; //通知幸运使用结果
	optional LuckCardAck luckcard_ack_msg = 91; //通知本场游戏有幸运点功能
	optional LuckCardUserOptAck luckcarduseropt_ack_msg = 92; //用户LuckCard选项
	optional AddLuckAck addluck_ack_msg = 93; //请求金币兑换幸运点 响应
	optional OpenAccountInterfaceAck openaccountinterface_ack_msg = 94; //打开结算界面
	optional UpdateAccountInforAck updateaccountinfor_ack_msg = 95; //更新结算信息
	optional GameCommonProtocolAck gamecommonprotocol_ack_msg = 96; //游戏通用协议
	optional RoomPlayerChgFlagsAck roomplayerchgflags_ack_msg = 97; //自由房间用户标志变更（比如是否桌主标志）
}

message EnterMatchReq  {
	optional uint32 matchclientver = 1;
	required bytes ticket = 2; // 比赛开始那条消息里面的 鉴权串
	optional uint32 gameclientver = 3;
	required uint32 gameid = 4;
}

message EnterMatchAck  {
	optional uint32 tourneyid = 1;
	required uint32 matchid = 2;
	required string matchname = 3;
	optional uint32 userid = 4;
	optional string nickname = 5;
	optional uint32 figureid = 6;
	optional uint32 matchrank = 7;
	optional uint32 totalmatchplayer = 8;
	required uint64 matchstarttime = 9;
	optional uint32 matchelapsesec = 10;
	optional uint32 titlestyle = 11;
	optional uint32	formid = 12;
}

message EnterRoundReq  {
	optional uint32 version = 1;
	required bytes ticket = 2; // 比赛开始那条消息里面的 鉴权串
	required uint32 gameid = 3;
}

message EnterRoundAck  {
	optional uint32 userid = 1;
	required uint32 seatorder = 2;
	required uint32 usertype = 3;
	optional int32 maxplayerspertable = 4;
}

message ExitGameReq  {
  optional uint32 nullvalue = 1;
}

message ExitGameAck  {
  optional uint32 nullvalue = 1;
}

message PushUserPlaceOrderPositionReq  {
  optional uint32 nullvalue = 1;
}

message PushUserPlaceOrderPositionAck  {
	required uint32 playercurplaceorder = 1;
	required uint32 totalplayercount = 2;
}



message GetStagePlayerOrderReq  {
  optional uint32 nullvalue = 1;
}

message GetRoundPlayerOrderReq {
	repeated uint32 userid = 1;
}

message ContinueReq  {
	required uint32 userid = 1;
}

message ContinueAck  {
	optional uint32 userid = 1;
}

message LeaveReq  {
	required uint32 userid = 1;
	optional uint32	noexchange = 2;		// 不兑换金币，0-表示兑换金币，1表示不兑换。默认值为0，兼容线上版本。
	optional uint32	savearchive = 3;	// 数据存档，0-表示不存档，1表示存档。默认值为1
}

message LeaveAck  {
	optional uint32 userid = 1;
}

message HematinicReq  {
	required uint32 userid = 1;
	required uint32 hematinic = 2;
}

message HematinicAck  {
	optional uint32 userid = 1;
	required uint32 hematinic = 2;
}

message PlayerReliveReq  {
	required uint32 userid = 1;
	required int32  relive = 2; //relive 0; else 1
}

message PlayerReliveAck  {
	optional uint32 userid = 1;
}

message RegisterAutoReq  {
	required uint32 partnerid = 1; // 目前固定 3,
	optional uint32 agent = 2;
	optional string agentmark = 3;
	optional bool bregister = 4;
	optional string nickname = 5;
	optional string username = 6;
	required string password = 7;
	optional uint32 figureid = 8;
}

message RegisterAutoAck  {
	optional uint32 userid = 1;
	required string nickname = 2;
	required string username = 3;
	required string password = 4;
	optional uint32 figureid = 5;
	optional uint32 bankaccid = 6;
}

message SeatPlayerInfo  {
	required uint32 userid = 1;
	required string nickname = 2;
	optional uint32 figureid = 3;
	optional uint32 ready = 4;
}

message PlayerSitDownReq  {
	required sint32 seat = 1;
}

message PlayerSitDownAck  {
	required SeatPlayerInfo playerinfo = 1;
	required sint32 seat = 2;
	optional int32 score = 3;
}

message AddHPReq  {
	required uint32 hp = 1;
}

message AddHPAck  {
	optional uint32 userid = 1;
	required uint32 hpadded = 2;
	required uint32 cost = 3;
}

message MarkPlayerIdleReq  {
	required bool idle = 1;
}

message MarkPlayerIdleAck  {
	required bool idle = 1;
}

message MarkAutoAddHPReq  {
	required bool autoaddhp = 1;
}

message MarkAutoAddHPAck  {
	required bool autoaddhp = 1;
}

message StartableAcceptInviteReq  {
	required bool accepted = 1;
}

message StartableAcceptInviteAck  {
	required bool accepted = 1;
}

message TipMsgAck  {
	required uint32 type = 1; // 提示的类型
	optional uint32 second = 2;
	required uint32 nextoper = 3;
	required string text = 4;
	optional int32  id = 5;
	optional string xml = 6;
}

message PushMatchStagePositionAck  {
	required uint32 stageid = 1;
	required uint32 boutid = 2;
	required string stageboutname = 3;
	required string stagename = 4;
	required string boutname = 5;
}

message GamePlayerOrderInfo  {
	required uint32 userid = 1;
	required string nickname = 2;
	required int32 score = 3;
	required uint32 placeorder = 4;
	required uint32 outroundstate = 5;
}

message StagePlayerOrderAck  {
	optional uint32 serial = 1;
	optional uint32 flags = 2;
	optional uint32 scoretype = 3;
	optional uint32 minwinnerorder = 4;
	repeated GamePlayerOrderInfo orderlist = 5;
}

message RoundPlayerOrderAck  {
	optional uint32 serial = 1;
	optional uint32 flags = 2;
	repeated GamePlayerOrderInfo orderlist = 3;
}

message PushMatchPlayerInfoAck  {
	optional string playerinfo = 1;
}

message GamePlayerInfo  {
	required uint32 seatorder = 1;
	required uint32 userid = 2;
	required string nickname = 3;
	optional uint32 figureid = 4;
	optional uint32 matchrank = 5;
	required int32 score = 6;
	required bool arrived = 7;
	required uint32 netstatus = 8;
	optional uint32 formid = 9;
	optional uint64 userid64 = 10; // 用户ID 64位
	optional string scorestr = 11; // 分数 string
}

message AddGamePlayerInfoAck  {
	required GamePlayerInfo playerinfo = 1;
}

message PushRoundRulerInfoAck  {
	required string rulerinfo = 1;
}

message BeginHandAck  {
	optional uint32 gamehand = 1;
	optional uint32 round = 2;
	optional uint32 table = 3;
}

message RulerInfoAck  {
	optional uint32 gametotalplayer = 1;
	optional uint32 tablenumber = 2;
	optional uint32 scoretype = 3;
	required uint32 scorebase = 4; // 游戏基数
	optional string roundrulername = 5;
	optional uint32 reserve = 6;
	required string property = 7; // 一些参数：用 , 分隔的，目前 第 2 个表示 每手牌的时间 ，第 3 个表示第一手牌的时间，第 7 个表示是否使用 JJ 炸弹规则
	required string titlename = 8; // 比赛名称
	required string rulernote = 9; // 3 人 PK 界面显示局制信息
	optional uint32 roundruler = 10;
}

message StagePlayerOrderChangedAck  {
	optional uint32 serial = 1;
	optional uint32 flags = 2;
	optional uint32 updatesecond = 3;
}

message NoQueryExitGameAck  {
	required bool noqueryexitgame = 1;
}

message PushMatchAwardAck  {
	required string awardtext = 1;
}

message ScoreBaseRaiseAck  {
	required uint32 newscorebase = 1;
}

message ChangeGameRulerNoteAck  {
	required string rulernote = 1;
}

message Hematinic  {
	required uint32 blood = 1;
	required uint32 cost = 2;
}

message RestAck  {
	required uint32 resttime = 1; // 剩余时间：岛屿赛等待是有时长限制的，时间到了不继续，就主动离开了
	required uint32 hematiniccount = 2; // 可购买的血瓶数量
	repeated Hematinic hematiniclist = 3; // 血瓶规则
	required uint32 life = 4; // 剩余血量（筹码）
	required uint32 coin = 5; // 能换多少金币
	required uint32 gamescount = 6; // 玩了几把了
	required uint32 multi = 7; // 当前积分倍数
	required uint32 nextlevelgames = 8; // 到下一个级别还有几把
	required uint32 nextlevelmulti = 9; // 到下一个级别积分倍数是多少
	required uint32 exchangerate = 10; // 金币和筹码的兑换比例
	required sint32 awardtimespan = 11; // 颁奖间隔
	required uint32 nextawardleftsecond = 12; // 距离下次颁奖时间还有多久
	optional int32 lasthandscore = 13; // 最后一局得分
	optional int32 gameresult = 14; // 游戏结果，0 == 未知， 1 == 胜利， 2 == 和， 3 == 负
}

message ExchangeislandAck
{
	repeated Hematinic hematiniclist = 1; // 血瓶规则
}

message WareReliveAck  {
	required uint32 wareid = 1;
	required uint32 warecount = 2;
	required uint32 score = 3;
	required uint32 liveplayercount = 4;
	required uint32 timeout = 5;
}

message ReliveCostAck  {
	required uint32 costtype = 1;
	required uint32 costid = 2;
	required uint32 amount = 3;
	required uint32 score = 4;
	required uint32 liveplayercount = 5;
	required uint32 timeout = 6;
}

message PushGameCountAwardInfoAck  {
	required string text = 1;
}

message PushPlayerGameDataAck  {
	optional uint32 userid = 1;
	required uint32 exchangerate = 2; // 兑换比例
	required uint32 leftchip = 3; // 剩余筹码
	optional uint32 curgamehand = 4;
	required uint32 totalfinishedgamecount = 5; // 总共完成了几局
	optional uint32 curfinishedgamecount = 6;
	optional uint64 userid64 = 7; // 用户ID 64位
	optional string leftchipstr = 8; // 剩余筹码或者当前生命值 string
}

message NotifyGuestRegisterAck  {
	required uint32 order = 1;
	required bool autoregister = 2; // 是否允许注册：如果不允许的话，就是把用户提出这个比赛了
}

message NetBreakAck  {
	required uint32 userid = 1;
	required uint32 seatorder = 2;
}

message NetResumeAck  {
	required uint32 userid = 1;
	required uint32 seatorder = 2;
}

message HistoryMsgBeginAck  {
  optional uint32 nullvalue = 1;
}

message HistoryMsgEndAck  {
  optional uint32 nullvalue = 1;
}

message HandOverAck  {
  optional uint32 nullvalue = 1;
}

message OverGameAck  {
  optional uint32 nullvalue = 1;
}

message SeatPlayerInfoEx  {
	optional uint32 userid = 1;
	optional int32 score = 2;
	optional uint32 firstbuyin = 3;
}

message InitGameTableAck  {
	repeated SeatPlayerInfo playerinfolist = 1;
	optional uint32 chatsvrip = 2;
	optional uint32 chatsvrport = 3;
	optional uint32 chatchannelid = 4;
	required uint32 maxaddtohp = 5;
