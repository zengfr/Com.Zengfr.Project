
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;

import "TKCagCommon.proto";

message CagSeasonReqMsg {
    optional CagRequestSeasonInfoReq cag_request_season_info_req = 1; // 请求赛季信息
    optional CagRequestSeasonAwardInfoReq cag_request_season_award_info_req = 2; // 请求赛季奖励信息
    optional CagGainSeasonAwardReq cag_gain_season_award_req = 3; // 获取赛季奖励
}

message CagSeasonAckMsg {
    optional CagRequestSeasonInfoAck cag_request_season_info_ack = 1; // 请求赛季信息
    optional CagRequestSeasonAwardInfoAck cag_request_season_award_info_ack = 2; // 请求赛季奖励信息
    optional CagGainSeasonAwardAck cag_gain_season_award_ack = 3; // 获取赛季奖励
    optional CagPushSeasonInfoAck cag_push_season_info_ack = 4; // 推送赛季信息
    optional CagPushSeasonAwardInfoAck cag_push_season_award_info_ack = 5; // 推送赛季奖励信息
}

// 赛季奖励
message SeasonAward {
    optional uint32 season_id = 1; // 赛季id
    optional uint32 award_key = 2; // 获取奖励凭据，如坦克大战的段位
    optional bytes award_str = 3; // 奖励信息字符串
    optional uint32 award_str_len = 4; // 奖励信息字符串长度
}

// 请求赛季信息
message CagRequestSeasonInfoReq {
    
}

// 请求赛季奖励信息
message CagRequestSeasonAwardInfoReq {

}

// 获取赛季奖励
message CagGainSeasonAwardReq {
    repeated uint32 season_ids = 1; // 赛季id列表
}

// 请求赛季信息
message CagRequestSeasonInfoAck {
    optional uint32 season_id = 1; // 当前赛季id
    optional uint32 season_remaining_seconds = 2; // 当前赛季剩余时间：单位秒
    optional TimePeriod season_period = 3; // 赛季时间周期
}

// 请求赛季奖励信息
message CagRequestSeasonAwardInfoAck {
    repeated SeasonAward season_award_list = 1; // 赛季奖励信息列表
}

// 获取赛季奖励
message CagGainSeasonAwardAck {
    optional uint32 result = 1; // 请求结果：0--成功 非0--失败
    repeated SeasonAward season_award_list = 2; // 赛季奖励列表
}

// 推送赛季信息
message CagPushSeasonInfoAck {
    optional uint32 season_id = 1; // 当前赛季id
    optional uint32 season_remaining_seconds = 2; // 当前赛季剩余时间：单位秒
    optional TimePeriod season_period = 3; // 赛季时间周期
}

// 推送赛季奖励
message CagPushSeasonAwardInfoAck {
    repeated SeasonAward season_award_list = 1; // 赛季奖励信息列表
}

