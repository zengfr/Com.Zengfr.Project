message BroadcastTeamMateRegisterReqMsg {
    optional uint32 userid = 1;
	required uint32 tourneyid = 2; // 开赛的 Tourney Id
	required uint32 matchid = 3; // 开赛的 Match Id
	optional string nick = 4;
	required uint32 gameid = 5; // 游戏 Id
	required uint32 productid = 6; // 产品 Id
	required int32 looknertype = 7;
	optional uint32 playerid = 8;
	required int32 watchdsttype = 9;
	required int32 tableid = 10;
	required TKAddrInfo addrinfo = 11;
	optional uint32 time = 12;  //票证获取时间
	optional string ticket = 13; //票证 startclientex里面的票证
	optional int32 watchtype = 14; // 旁观类型： 1（按局旁观）；2（按轮旁观）；3（按比赛旁观）
}

message GeneralLookonAckMsg {
    optional uint32 gameid = 1; //游戏id，match消息不赋值，游戏透传消息赋上实际游戏id
    optional bytes   datas = 2; //旁观通用消息字节数据
}

message BroadcastTeamMateRegisterAckMsg   {
	required int32 success = 1;  // 是否成功，1 成功，0失败
	required uint32 matchid = 2; // 开赛的 Match Id
	optional int32 watchtype = 3; // 旁观类型： 1（按局旁观）；2（按轮旁观）；3（按比赛旁观）
}

message BroadcastBreakAckMsg   {
	required uint32 matchid = 1; // 开赛的 Match Id
}

message BroadcastGetOnlookerListReqMsg {
	optional uint32 userid = 1;
}

message BroadcastGetOnlookerListAckMsg {
	optional uint32 userid = 1;
	optional string suffix = 2;    // 后缀透传数据
}

message GeneralLookonReqMsg {
    optional bytes   datas = 1; //旁观通用消息字节数据
}

