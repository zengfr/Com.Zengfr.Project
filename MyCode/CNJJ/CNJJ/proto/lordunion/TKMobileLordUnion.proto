
// See README.txt for information and build instructions.

package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;

import "TKMatch.proto";
import "TKLord.proto";
import "TKHLLord.proto";
import "TKLZLord.proto";
import "TKSDLord.proto";
import "TKHZLord.proto";
import "TKDDLord.proto";
import "TKDBLord.proto";

message TKMobileReqMsg {
    optional uint32 param = 1;
    optional MatchReqMsg match_req_msg = 3; //比赛消息
    optional LordReqMsg lord_req_msg = 4; //斗地主消息
    optional HLLordReqMsg hllord_req_msg = 15; //欢乐斗地主
    optional LZLordReqMsg lzlord_req_msg = 20; //癞子斗地主
    optional SDLordReqMsg sdlord_req_msg = 31; //闪电斗地主
    optional HZLordReqMsg hzlord_req_msg = 124; //混子斗地主
    optional DDLordReqMsg ddlord_req_msg = 125;//搭档斗地主
    optional DBLordReqMsg dblord_req_msg = 143;//多宝牌
}

message TKMobileAckMsg {
    optional uint32 param = 1; // 为了节省流量，这个参蔵在很多消息諫覩特殊含义，具体见单独的消息注释
    optional MatchAckMsg match_ack_msg = 3; //比赛消息
    optional LordAckMsg lord_ack_msg = 4; //斗地主消息
    optional HLLordAckMsg hllord_ack_msg = 15; //欢乐斗地主
    optional LZLordAckMsg lzlord_ack_msg = 20; //癞子斗地主
    optional SDLordAckMsg sdlord_ack_msg = 31; //闪电斗地主
    optional HZLordAckMsg hzlord_ack_msg = 124; //混子斗地主
    optional DDLordAckMsg ddlord_ack_msg = 125; //搭档斗地主消息
    optional DBLordAckMsg dblord_ack_msg = 143;//多宝牌
}

