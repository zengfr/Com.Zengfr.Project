
package cn.jj.service.msg.protocol;
//option optimize_for = CODE_SIZE;
//option optimize_for = LITE_RUNTIME;
message HZLordReqMsg  {
	required uint32 matchid = 1;       //比赛ID
//	optional uint32 gameid = 2;
	optional HZLordCallScoreReq hzlordcallscore_req_msg = 3;     //叫地主
	optional HZLordTakeoutCardReq hzlordtakeoutcard_req_msg = 4; //出牌
	optional HZLordTrustReq hzlordtrust_req_msg = 5;                //托管
	optional HZLordLordGiveUpReq hzlord_give_up_req_msg = 9; // 地主认输
	optional HZLordClientReadyReq hzlordclientready_req_msg = 11; //客户端准备好，通知游戏服务
}

message HZLordAckMsg  {
	required uint32 matchid = 1;     //比赛ID
//	optional uint32 gameid = 2;
	optional HZLordCallScoreAck hzlordcallscore_ack_msg = 3; //叫地主
	optional HZLordTakeoutCardAck hzlordtakeoutcard_ack_msg = 4; //出牌
	optional HZLordTrustAck hzlordtrust_ack_msg = 5;        //托管
	optional HZLordInitCardAck hzlordinitcard_ack_msg = 6; //发牌
	optional HZLordInitBottomCardAck hzlordinitbottomcard_ack_msg = 7;  //发底牌
	optional HZLordResultAck hzlordresult_ack_msg = 8;     //结算
	optional HZLordTipMsgAck hzlordtipmsg_ack_msg = 9;  //提示
	optional HZLordEmptyAck hzlordempty_ack_msg = 10;      //流局
	optional HZLordChangeTakeoutTimeAck hzlordchangetakeouttime_ack_msg = 11; //减少出牌时间
	optional HZLordUpdateMultiAck hzlordupdatemulti_ack_msg = 17; //更新倍数消息
	optional HZLordWaitClientReadyAck hzlordwaitclientready_ack_msg = 19;	//开始等待客户端准备好
	optional uint64 timeStamp = 23; //时间戳, 下面这些消息会带时间戳hzLordCallScoreAck,hzLordTakeoutCardAck,hzLordInitCardAck
	                               // hzLordForceCallAck,hzLordOperateStartAck,hzLordOperateResultAck
								   // hzLordGameStartAck,hzLordWaitClientReadyAck
}

//牌张定义
message HZLordCard{
	required uint32 cardcolor = 1; //花色
	required uint32 cardpoint = 2; //点数
}

message HZLordCallScoreReq  {
	optional uint32 nextcallseat = 1;
	required uint32 curcallseat = 2;
	required uint32 curcall = 3;          //当前叫分，0-过，1-叫地主，2-杠
	optional uint32 validatescore = 4;    //之前有效叫分
}

message HZLordCallScoreAck  {
	required uint32 nextcallseat = 1;
	required uint32 curcallseat = 2;
	required uint32 curcall = 3;
	required uint32 validatescore = 4;
}

message HZLordTakeoutCardReq  {
	required uint32 seat = 1;
	optional uint32 nextplayer = 2;
	optional uint32 passplayer = 3;
	optional uint32 multiple = 4;
	required bool isover = 6;
	repeated HZLordCard cards = 7;
	optional uint32 msgcnt = 8; //出牌消息的消息序号
}

message HZLordTakeoutCardAck  {
	required uint32 seat = 1;
	required uint32 nextplayer = 2;
	required int32 passplayer = 3;
	required uint32 multiple = 4;
	required bool isover = 6;
	repeated HZLordCard cards = 7;
	optional bool nextautogo = 8;	//下一个玩家是否最后一手牌服务帮忙自动打出
	optional uint32 msgcnt = 9;	//出牌消息的消息序号
	optional bool nextautopass = 10; //下一个玩家是否游戏服务自动pass
}

message HZLordTrustReq  {
	required uint32 seat = 1;
	required uint32 trust = 2;
	required uint32 userid = 3;
}

message HZLordTrustAck  {
	required uint32 seat = 1;
	required uint32 trust = 2;
	optional uint32 userid = 3;
}

message HZLordInitCardAck  {
	required uint32 firstcallseat = 1;
	optional uint32 firstinitcard = 2;
	repeated HZLordCard cards = 3;
}

message HZLordInitBottomCardAck  {
	required uint32 hzlordseat = 1;
	optional uint32 firstfarmerseat = 2;
	required uint32 bottomscore = 3;
	repeated HZLordCard cards = 4;
}

message HZLordResultAck  {
	repeated int32 score = 1 [packed=true];
	required uint32 winseat = 2;
	repeated uint32 cardcount = 3 [packed=true];
	required uint32 spring = 4;
	repeated HZLordCard  cards = 5;
	optional uint32 islordgiveup = 6;	//认输结果（无认输没有此项，1-地主认输， 2-农民认输）
}

message HZLordTipMsgAck  {
	required string tip = 1;
}

message HZLordEmptyAck  {
	repeated uint32 scores = 1[packed=true];
}

message HZLordChangeTakeoutTimeAck  {
	required uint32 seat = 1;
	required uint32 takeouttime = 2;
}

message HZLordUpdateMultiAck {
	required int32 curmulti = 4; //当前游戏总倍数
}

message HZLordWaitClientReadyAck{
	required uint64 timestamp = 1; //时间戳
}

message HZLordClientReadyReq{
	required uint32 seat = 1;	//座位号
}

message HZLordLordGiveUpReq
{
	optional uint32 null = 1;
}
